# Taskfile：收敛项目常用命令。安装 task：https://taskfile.dev
# 用法：task <名称>；混音输入路径用 -- 透传。
version: "3"

vars:
  BIN: app-audio-recorder
  RELEASE_BIN: .build/release/{{.BIN}}
  APP_BUNDLE: .build/release/App Audio Recorder.app
  # 在嵌套沙箱环境（如 IDE Agent）里，SwiftPM 自带的 sandbox-exec 会与外层沙箱冲突
  # （sandbox_apply: Operation not permitted）。禁用 SwiftPM 沙箱以规避；本地正常终端下加不加都可。
  SANDBOX_FLAG: --disable-sandbox

tasks:
  default:
    desc: 列出所有可用任务
    cmds:
      - task --list
    silent: true

  build:
    desc: debug 构建
    cmds:
      - swift build {{.SANDBOX_FLAG}}

  build:release:
    desc: release 构建 App
    cmds:
      - swift build {{.SANDBOX_FLAG}} -c release

  test:
    desc: 运行 SwiftPM 测试
    cmds:
      - swift test {{.SANDBOX_FLAG}}

  app:bundle:
    desc: 构建并组装 App Audio Recorder.app；SIGN_IDENTITY 可指定签名证书，默认 ad-hoc
    deps: [build:release]
    vars:
      SIGN_IDENTITY: '{{.SIGN_IDENTITY | default "-"}}'
    cmds:
      - mkdir -p "{{.APP_BUNDLE}}/Contents/MacOS"
      - cp "{{.RELEASE_BIN}}" "{{.APP_BUNDLE}}/Contents/MacOS/"
      - cp Support/Info.plist "{{.APP_BUNDLE}}/Contents/"
      - /usr/bin/plutil -lint "{{.APP_BUNDLE}}/Contents/Info.plist"
      - /usr/bin/codesign --force --sign "{{.SIGN_IDENTITY}}" "{{.APP_BUNDLE}}"

  app:run:
    desc: 构建并打开 GUI app
    deps: [app:bundle]
    cmds:
      - open "{{.APP_BUNDLE}}"

  app:install:
    desc: 安装 GUI app 到 /Applications
    deps: [app:bundle]
    cmds:
      - /usr/bin/ditto "{{.APP_BUNDLE}}" "/Applications/App Audio Recorder.app"

  merge:
    desc: 用 ffmpeg 把 App 产出的双轨 .m4a 混音成 <基名>-merged.wav；容器路径用 -- 传，改增益用 GAIN=0.5
    silent: true
    vars:
      # 混音增益：两路相加前统一乘的系数。0.5 保证不削波，0.707≈-3dB 折中，1.0 等量叠加。
      GAIN: '{{.GAIN | default "0.707"}}'
      OUT: '{{.CLI_ARGS | trimSuffix ".m4a"}}-merged.wav'
    cmds:
      # 两条轨格式恒等（AudioContainerWriter 用同一份 settings），amix 自然跟随其采样率/声道，无需 -ar/-ac 探测。
      # normalize=0 + volume=<gain> 即 gain*(app+mic) 纯和，pcm_s16le 饱和量化即硬限幅。
      # 输入缺失/为空、单轨、ffmpeg 不存在等错误交给 ffmpeg/shell 自己报（非零退出即中止），不在此重复守卫。
      - >-
        /opt/sb/bin/ffmpeg -hide_banner -loglevel error -nostdin -y -i "{{.CLI_ARGS}}"
        -filter_complex "[0:a:0][0:a:1]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0,volume={{.GAIN}}[out]"
        -map "[out]" -c:a pcm_s16le -- "{{.OUT}}"
      - echo "已保存：{{.OUT}}"

  clean:
    desc: 清理构建产物
    cmds:
      - swift package {{.SANDBOX_FLAG}} clean
