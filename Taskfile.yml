# Taskfile：收敛项目常用命令。安装 task：https://taskfile.dev
# 用法：task <名称>；给可执行文件传参用 -- 透传，如 `task record -- --app WeChat --duration 30`
version: "3"

vars:
  BIN: app-audio-recorder
  RELEASE_BIN: .build/release/{{.BIN}}
  INSTALL_DIR: /usr/local/bin
  # 在嵌套沙箱环境（如 IDE Agent）里，SwiftPM 自带的 sandbox-exec 会与外层沙箱冲突
  # （sandbox_apply: Operation not permitted）。禁用 SwiftPM 沙箱以规避；本地正常终端下加不加都可。
  SANDBOX_FLAG: --disable-sandbox

tasks:
  default:
    desc: 列出所有可用任务
    cmds:
      - task --list
    silent: true

  build:
    desc: debug 构建
    cmds:
      - swift build {{.SANDBOX_FLAG}}

  build:release:
    desc: release 构建，产物在 .build/release/{{.BIN}}
    cmds:
      - swift build {{.SANDBOX_FLAG}} -c release

  test:
    desc: 运行 SwiftPM 测试
    cmds:
      - swift test {{.SANDBOX_FLAG}}

  run:
    desc: 运行工具，额外参数用 -- 透传（如 task run -- list）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} {{.CLI_ARGS}}

  list:
    desc: 列出可录音的运行中 app
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} list

  record:
    desc: 录制（默认微信），Ctrl-C 结束；参数用 -- 透传（如 task record -- --app WeChat）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} record {{.CLI_ARGS}}

  merge:
    desc: 把多轨容器（record 产出的 .m4a）内两条轨混音成一个 WAV；参数用 -- 透传（如 task merge -- 微信-2026-07-27.m4a）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} merge {{.CLI_ARGS}}

  install:
    desc: release 构建并安装到 {{.INSTALL_DIR}}
    deps: [build:release]
    cmds:
      - cp {{.RELEASE_BIN}} {{.INSTALL_DIR}}/

  clean:
    desc: 清理构建产物
    cmds:
      - swift package {{.SANDBOX_FLAG}} clean
