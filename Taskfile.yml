# Taskfile：收敛项目常用命令。安装 task：https://taskfile.dev
# 用法：task <名称>；给可执行文件传参用 -- 透传，如 `task record -- --app WeChat --duration 30`
version: "3"

vars:
  BIN: app-audio-recorder
  RELEASE_BIN: .build/release/{{.BIN}}
  INSTALL_DIR: /usr/local/bin
  # 在嵌套沙箱环境（如 IDE Agent）里，SwiftPM 自带的 sandbox-exec 会与外层沙箱冲突
  # （sandbox_apply: Operation not permitted）。禁用 SwiftPM 沙箱以规避；本地正常终端下加不加都可。
  SANDBOX_FLAG: --disable-sandbox

tasks:
  default:
    desc: 列出所有可用任务
    cmds:
      - task --list
    silent: true

  build:
    desc: debug 构建
    cmds:
      - swift build {{.SANDBOX_FLAG}}

  build:release:
    desc: release 构建，产物在 .build/release/{{.BIN}}
    cmds:
      - swift build {{.SANDBOX_FLAG}} -c release

  test:
    desc: 运行 SwiftPM 测试
    cmds:
      - swift test {{.SANDBOX_FLAG}}

  run:
    desc: 运行工具，额外参数用 -- 透传（如 task run -- list）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} {{.CLI_ARGS}}

  list:
    desc: 列出可录音的运行中 app
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} list

  record:
    desc: 录制（默认微信），Ctrl-C 结束；参数用 -- 透传（如 task record -- --app WeChat）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} record {{.CLI_ARGS}}

  record:wechat:
    desc: 快捷录制微信（bundleId com.tencent.xinWeChat），Ctrl-C 结束；额外参数用 -- 透传（如 task record:wechat -- --duration 30）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} record --app com.tencent.xinWeChat {{.CLI_ARGS}}

  record:signal:
    desc: 快捷录制 Signal（按名称关键字匹配），Ctrl-C 结束；额外参数用 -- 透传（如 task record:signal -- --duration 30）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} record --app Signal {{.CLI_ARGS}}

  watch:
    desc: 监听目标 app（默认微信）麦克风活动，通话开始自动录制、结束自动保存，Ctrl-C 退出；参数用 -- 透传（如 task watch -- --output-dir ~/Desktop/calls）
    cmds:
      - swift run {{.SANDBOX_FLAG}} {{.BIN}} watch {{.CLI_ARGS}}

  merge:
    desc: 用 ffmpeg 把多轨容器（record 产出的 .m4a）内 app+mic 两条轨离线混音成 <基名>-merged.wav；容器路径用 -- 传（如 task merge -- 微信-2026-07-27.m4a），改增益用 GAIN=0.5
    silent: true
    vars:
      # 混音增益：两路相加前统一乘的系数。0.5 保证不削波，0.707≈-3dB 折中，1.0 等量叠加。
      GAIN: '{{.GAIN | default "0.707"}}'
      OUT: '{{.CLI_ARGS | trimSuffix ".m4a"}}-merged.wav'
    cmds:
      # 两条轨格式恒等（AudioContainerWriter 用同一份 settings），amix 自然跟随其采样率/声道，无需 -ar/-ac 探测。
      # normalize=0 + volume=<gain> 即 gain*(app+mic) 纯和，pcm_s16le 饱和量化即硬限幅。
      # 输入缺失/为空、单轨、ffmpeg 不存在等错误交给 ffmpeg/shell 自己报（非零退出即中止），不在此重复守卫。
      - >-
        /opt/sb/bin/ffmpeg -hide_banner -loglevel error -nostdin -y -i "{{.CLI_ARGS}}"
        -filter_complex "[0:a:0][0:a:1]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0,volume={{.GAIN}}[out]"
        -map "[out]" -c:a pcm_s16le -- "{{.OUT}}"
      - echo "已保存：{{.OUT}}"

  install:
    desc: release 构建并安装到 {{.INSTALL_DIR}}
    deps: [build:release]
    cmds:
      - cp {{.RELEASE_BIN}} {{.INSTALL_DIR}}/

  clean:
    desc: 清理构建产物
    cmds:
      - swift package {{.SANDBOX_FLAG}} clean
